plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven {
        name = 'Curios'
        url = uri('https://maven.theillusivec4.top/')
    }
}

base {
    archivesName = 'Pastbound'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            curios_version         : curios_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


tasks.register('packageRelease') {
    group = 'build'
    description = 'Builds the processed NeoForge jar and copies it to dist with a SHA-256 sidecar.'
    dependsOn tasks.named('jar')
    doLast {
        def releaseDir = layout.projectDirectory.dir('dist').asFile
        releaseDir.mkdirs()
        def releaseName = "${base.archivesName.get()}-${project.version}.jar"
        def releaseJar = new File(releaseDir, releaseName)
        def sourceJar = tasks.named('jar').get().archiveFile.get().asFile
        java.nio.file.Files.copy(sourceJar.toPath(), releaseJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def hash = java.nio.file.Files.readAllBytes(releaseJar.toPath())
        def hex = digest.digest(hash).collect { String.format('%02x', it) }.join()
        new File(releaseDir, "${releaseName}.sha256").text = "${hex}  ${releaseName}\n"
        logger.lifecycle("Release jar: ${releaseJar}")
    }
}

 tasks.named('build') {
    finalizedBy tasks.named('packageRelease')
}
